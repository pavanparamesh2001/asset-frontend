<h1 class="text-2xl font-bold mb-4">Edit Asset</h1>

<p *ngIf="loading">Loading...</p>

<form *ngIf="!loading" [formGroup]="form" (ngSubmit)="onSubmit()" class="space-y-4 bg-white p-6 rounded-lg shadow max-w-lg">

  <div>
    <label class="block text-sm font-medium mb-1">Asset Name</label>
    <input formControlName="assetName" class="w-full border rounded px-3 py-2" />
  </div>

  <div>
    <label class="block text-sm font-medium mb-1">Category</label>
    <select formControlName="category" class="w-full border rounded px-3 py-2">
      <option *ngFor="let c of categories" [value]="c">{{ c }}</option>
    </select>
  </div>

  <div>
    <label class="block text-sm font-medium mb-1">Asset Type</label>
    <select formControlName="assetType" class="w-full border rounded px-3 py-2">
      <option *ngFor="let t of assetTypes" [value]="t">{{ t }}</option>
    </select>
  </div>

  <div>
    <label class="block text-sm font-medium mb-1">Brand</label>
    <input formControlName="brand" class="w-full border rounded px-3 py-2" />
  </div>

  <div>
    <label class="block text-sm font-medium mb-1">Model</label>
    <input formControlName="deviceModel" class="w-full border rounded px-3 py-2" />
  </div>

  <div>
    <label class="block text-sm font-medium mb-1">Serial Number</label>
    <input formControlName="serialNumber" class="w-full border rounded px-3 py-2" />
  </div>

  <div>
    <label class="block text-sm font-medium mb-1">Purchase Date</label>
    <input type="date" formControlName="purchaseDate" class="w-full border rounded px-3 py-2" />
  </div>

  <div>
    <label class="block text-sm font-medium mb-1">Purchase Cost</label>
    <input type="number" formControlName="purchaseCost" class="w-full border rounded px-3 py-2" />
  </div>

  <div>
    <label class="block text-sm font-medium mb-1">Warranty End Date</label>
    <input type="date" formControlName="warrantyEndDate" class="w-full border rounded px-3 py-2" />
  </div>

  <div>
    <label class="block text-sm font-medium mb-1">Bill Status</label>
    <select formControlName="billStatus" class="w-full border rounded px-3 py-2">
      <option *ngFor="let b of billStatuses" [value]="b">{{ b }}</option>
    </select>
  </div>

  <div>
    <label class="block text-sm font-medium mb-1">Bill Number</label>
    <input formControlName="billNumber" class="w-full border rounded px-3 py-2" />
  </div>

  <div>
    <label class="block text-sm font-medium mb-1">Department</label>
    <input formControlName="department" class="w-full border rounded px-3 py-2" />
  </div>

  <div>
    <label class="block text-sm font-medium mb-1">Notes</label>
    <textarea formControlName="notes" class="w-full border rounded px-3 py-2"></textarea>
  </div>

  <p *ngIf="errorMessage" class="text-red-600 text-sm">{{ errorMessage }}</p>

  <button type="submit" [disabled]="submitting"
    class="bg-slate-800 text-white px-4 py-2 rounded hover:bg-slate-700 disabled:opacity-50">
    {{ submitting ? 'Saving...' : 'Update Asset' }}
  </button>
</form>
