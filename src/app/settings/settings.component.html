<h1 class="text-2xl font-bold mb-6">Settings</h1>

<div class="grid gap-6 max-w-lg">
  <form [formGroup]="passwordForm" (ngSubmit)="changePassword()" class="space-y-4 bg-white p-6 rounded-lg shadow">
    <h2 class="text-lg font-semibold">Change Password</h2>

    <div>
      <label class="block text-sm font-medium mb-1">Current Password</label>
      <input type="password" formControlName="currentPassword" class="w-full border rounded px-3 py-2" />
    </div>

    <div>
      <label class="block text-sm font-medium mb-1">New Password</label>
      <input type="password" formControlName="newPassword" class="w-full border rounded px-3 py-2" />
    </div>

    <p *ngIf="passwordMessage" class="text-green-600 text-sm">{{ passwordMessage }}</p>
    <p *ngIf="passwordError" class="text-red-600 text-sm">{{ passwordError }}</p>

    <button type="submit" class="bg-slate-800 text-white px-4 py-2 rounded hover:bg-slate-700">
      Update Password
    </button>
  </form>

  <form [formGroup]="usernameForm" (ngSubmit)="changeUsername()" class="space-y-4 bg-white p-6 rounded-lg shadow">
    <h2 class="text-lg font-semibold">Change Username</h2>

    <div>
      <label class="block text-sm font-medium mb-1">New Username</label>
      <input formControlName="newUsername" class="w-full border rounded px-3 py-2" />
    </div>

    <div>
      <label class="block text-sm font-medium mb-1">Current Password</label>
      <input type="password" formControlName="currentPassword" class="w-full border rounded px-3 py-2" />
    </div>

    <p *ngIf="usernameMessage" class="text-green-600 text-sm">{{ usernameMessage }}</p>
    <p *ngIf="usernameError" class="text-red-600 text-sm">{{ usernameError }}</p>

    <button type="submit" class="bg-slate-800 text-white px-4 py-2 rounded hover:bg-slate-700">
      Update Username
    </button>
  </form>
</div>
