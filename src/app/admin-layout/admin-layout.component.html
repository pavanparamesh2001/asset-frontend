
<div class="min-h-screen bg-slate-50">
  <nav class="bg-slate-800 text-white px-6 py-3 flex justify-between items-center">
    <div class="flex gap-6 text-sm font-medium">
      <a routerLink="/assets" class="hover:text-slate-300">Assets</a>
      <a routerLink="/assets/register" class="hover:text-slate-300">Register Asset</a>
      <a routerLink="/employees" class="hover:text-slate-300">Employees</a>
      <a routerLink="/settings" class="hover:text-slate-300">Settings</a>
    </div>
