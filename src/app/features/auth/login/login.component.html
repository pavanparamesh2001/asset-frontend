<div class="flex justify-center items-center min-h-[70vh]">
  <form [formGroup]="form" (ngSubmit)="onSubmit()" class="space-y-4 bg-white p-8 rounded-lg shadow w-full max-w-sm">

    <div class="flex justify-center mb-2">
      <img src="/images/roda-logo.jpeg" alt="Company Logo" class="h-16 object-contain" />
    </div>



    <div>
      <label class="block text-sm font-medium mb-1">Username or Email</label>
      <input formControlName="username" class="w-full border rounded px-3 py-2" />
    </div>

    <div>
      <label class="block text-sm font-medium mb-1">Password</label>
      <input type="password" formControlName="password" class="w-full border rounded px-3 py-2" />
    </div>

    <p *ngIf="errorMessage" class="text-red-600 text-sm">{{ errorMessage }}</p>

    <button type="submit" [disabled]="submitting"
      class="w-full bg-slate-800 text-white px-4 py-2 rounded hover:bg-slate-700 disabled:opacity-50">
      {{ submitting ? 'Logging in...' : 'Login' }}
    </button>
  </form>
</div>
