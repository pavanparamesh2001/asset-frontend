<h1 class="text-2xl font-bold mb-4">Add Employee</h1>

<form [formGroup]="form" (ngSubmit)="onSubmit()" class="space-y-4 bg-white p-6 rounded-lg shadow max-w-lg">

  
  <div>
    <label class="block text-sm font-medium mb-1">Full Name</label>
    <input formControlName="name" class="w-full border rounded px-3 py-2" />
    <p
    *ngIf="form.controls.name.touched && form.controls.name.hasError('required')"
    class="text-red-600 text-sm mt-1"
  >
    Full name is required.
  </p>
  </div>

  <div>
    <label class="block text-sm font-medium mb-1">Email</label>
    <input type="email" formControlName="email" class="w-full border rounded px-3 py-2" />
     <p
    *ngIf="form.controls.email.touched && form.controls.name.hasError('required')"
    class="text-red-600 text-sm mt-1"
  >
    Email is required.
  </p>
  </div>

  <div>
    <label class="block text-sm font-medium mb-1">Phone Number</label>
    <input formControlName="phone" class="w-full border rounded px-3 py-2" />
   <p
  *ngIf="form.controls.phone.touched && form.controls.phone.hasError('required')"
  class="text-red-600 text-sm mt-1"
>
  Phone number is required.
</p>

<p
  *ngIf="form.controls.phone.touched && form.controls.phone.hasError('pattern')"
  class="text-red-600 text-sm mt-1"
>
  Phone number must contain exactly 10 digits.
</p> 
  </div>

  <div>
    <label class="block text-sm font-medium mb-1">Department</label>
    <input formControlName="department" class="w-full border rounded px-3 py-2" />
  </div>
<div>
  <label class="block text-sm font-medium mb-1">Designation</label>
  <input formControlName="designation" class="w-full border rounded px-3 py-2" placeholder="e.g. Sales Executive" />
</div>
  <p *ngIf="errorMessage" class="text-red-600 text-sm">{{ errorMessage }}</p>

  <button type="submit" [disabled]="submitting"
    class="bg-slate-800 text-white px-4 py-2 rounded hover:bg-slate-700 disabled:opacity-50">
    {{ submitting ? 'Saving...' : 'Add Employee' }}
  </button>
</form>
